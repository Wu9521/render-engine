services:
  - type: web
    name: wu9521-box
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: SSH_PASS
        generateValue: true
      - key: TTYD_USER
        value: admin
      - key: SSH_PUBKEY
        value: ""
      - key: ENABLE_EASYTIER
        value: ""
      - key: ET_NAME
        value: ""
      - key: ET_SECRET
        generateValue: true
      - key: ET_PEERS
        value: ""
      - key: ENABLE_SINGBOX
        value: ""
      - key: SINGBOX_UUID
        value: ""
      - key: KOMARI_TOKEN
        value: ""
      - key: KOMARI_ENDPOINT
        value: ""
      - key: ENABLE_KEEPALIVE
        value: "true"
      - key: KEEPALIVE_INTERVAL
        value: "300"
